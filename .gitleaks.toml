# gitleaks configuration: all default rules, plus one known false positive.

[extend]
useDefault = true

# The NACA 0012 key-points file name (data/support/naca_kp/) appears next to names such as
# "naca_key_points_file" in run metadata and logs, and its entropy is above the generic-api-key
# threshold. It is a file name, not a secret.
[[allowlists]]
description = "NACA 0012 key-points file name"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^naca_0012_M0-9281_RE250k_M0-093_RE250000\.txt$''']
