[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airfoil-optimization"
version = "0.1.0"
description = "Wing geometry optimization with ML surrogates of an XFOIL + AVL simulation chain"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "optuna",
    "torch",
    "joblib",
    "matplotlib",
    "seaborn",
    "adjustText",
    "tqdm",
    "psutil",
    "threadpoolctl",
    "cst_modeling3d==0.2.8",
    "pywinpty; sys_platform == 'win32'",
    "pexpect; sys_platform != 'win32'",
]

[tool.setuptools]
packages = ["ai_support", "file_handling_support", "geometric_support", "simulation_support", "ux_support"]
package-dir = {"" = "src"}
